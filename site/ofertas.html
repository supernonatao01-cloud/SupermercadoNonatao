<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Ofertas · Nonatão Supermercados</title>
  <meta name="description" content="Veja as ofertas que estão valendo agora no Nonatão Supermercados, em Uiraúna-PB. Navegue pelas páginas e compartilhe no WhatsApp.">
  <meta name="theme-color" content="#0733A5">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="assets/icon-192.png">
  <meta property="og:title" content="Ofertas · Nonatão Supermercados">
  <meta property="og:description" content="As ofertas que estão valendo agora no Nonatão.">
  <meta property="og:image" content="assets/og.jpg">
  <link rel="preload" href="assets/fonts/PlusJakartaSans.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/Baloo2.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/pages.css">
  <link rel="stylesheet" href="css/flyer.css">
  <script src="js/config.js"></script>
</head>
<body class="page">
  <main id="conteudo">
    <div class="demo-banner" id="demo" hidden>Modo demonstração: estas ofertas são só de exemplo e ficam neste navegador.</div>

    <section class="phero">
      <svg class="phero__ico" viewBox="0 0 24 24" aria-hidden="true"><use href="assets/icons.svg#i-tag"/></svg>
      <div class="wrap">
        <p class="eyebrow">Ofertas no ar</p>
        <h1>Ofertas <em>online</em></h1>
        <p>Veja as ofertas que estão valendo agora, folheie as páginas e compartilhe no WhatsApp.</p>
      </div>
    </section>

    <div class="daytabs" id="barra-abas" hidden>
      <div class="wrap">
        <div class="daytabs__row" role="tablist" aria-label="Ofertas" id="tabs"></div>
      </div>
    </div>

    <div class="wrap" aria-live="polite">
      <div id="viewer-host"></div>
    </div>

    <dialog class="zoom" id="zoom" aria-label="Oferta em tela cheia">
      <div class="zoom__bar">
        <b id="zoom-t">Oferta</b>
        <button type="button" id="zoom-prev" aria-label="Página anterior">‹</button>
        <button type="button" id="zoom-next" aria-label="Próxima página">›</button>
        <button type="button" id="zoom-mais" aria-label="Ampliar ou reduzir">🔍 Zoom</button>
        <button type="button" id="zoom-x" aria-label="Fechar">✕</button>
      </div>
      <div class="zoom__area" id="zoom-area"><img id="zoom-img" alt=""></div>
      <button type="button" class="zoom__lado zoom__lado--p" id="zoom-lp" aria-label="Página anterior">‹</button>
      <button type="button" class="zoom__lado zoom__lado--n" id="zoom-ln" aria-label="Próxima página">›</button>
    </dialog>
  </main>

  <script type="module" src="js/ofertas.js"></script>
</body>
</html>
